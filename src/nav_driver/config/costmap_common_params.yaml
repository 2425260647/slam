obstacle_range: 2.5
raytrace_range: 3.0

# 用 footprint 代替圆形，更贴合车体（长64cm，宽57cm）
footprint: "[[-0.32, -0.285], [-0.32, 0.285], [0.32, 0.285], [0.32, -0.285]]"

inflation_radius: 0.30

# Keep the local/global costmaps and TEB on the same measured Scout Mini
# polygon. The launch file repeats this explicitly for namespaced move_base
# parameters; this file is the reusable source for other bringups.
footprint_padding: 0.01
robot_radius: 0.33

observation_sources: laser_scan
laser_scan:
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
  # sensor_frame 通常由 tf 自动提供，可不写，或设为 base_link
