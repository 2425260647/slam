# 通用设置
controller_frequency: 5.0
planner_frequency: 0.5
recovery_behavior_enabled: true
clearing_rotation_allowed: true

# 全局规划器：A*
base_global_planner: "global_planner/GlobalPlanner"
base_local_planner: "teb_local_planner/TebLocalPlannerROS"

# 代价地图通用参数
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 1.0
  publish_frequency: 1.0
  static_map: true
  rolling_window: false
  width: 50.0
  height: 50.0
  origin_x: -25.0
  origin_y: -25.0
  resolution: 0.05
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    track_unknown_space: true
  obstacle_layer:
    observation_sources: laser_scan
    laser_scan:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 4.0
      observation_persistence: 0.5
  inflation_layer:
    inflation_radius: 0.30
  footprint: "[[-0.32, -0.285], [-0.32, 0.285], [0.32, 0.285], [0.32, -0.285]]"
  footprint_padding: 0.01
  robot_radius: 0.33

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.1
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: laser_scan
    laser_scan:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 4.0
      observation_persistence: 0.35
  inflation_layer:
    inflation_radius: 0.30
  footprint: "[[-0.32, -0.285], [-0.32, 0.285], [0.32, 0.285], [0.32, -0.285]]"
  footprint_padding: 0.01
  robot_radius: 0.33
